name: Scheduled jobs

# GitHub runs schedules only from the default branch. Times are UTC.
on:
  schedule:
    - cron: "7 * * * *"      # hourly: escalate complaints waiting over a day
    - cron: "37 20 * * *"    # daily 02:07 IST: reminders, locking, deletion, 12-month retention
    - cron: "17 */6 * * *"   # every 6 hours: refresh stale AI suggestion pools
  workflow_dispatch:
    inputs:
      job:
        description: "hourly, daily or suggestions"
        required: true
        default: hourly

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Pick job
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          case "$SCHEDULE" in
            "7 * * * *") job=hourly ;;
            "37 20 * * *") job=daily ;;
            "17 */6 * * *") job=suggestions ;;
            *) job="$INPUT_JOB" ;;
          esac
          case "$job" in hourly|daily|suggestions) ;; *) echo "Unknown job"; exit 1 ;; esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Call app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST -m 280 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/${{ steps.pick.outputs.job }}"
